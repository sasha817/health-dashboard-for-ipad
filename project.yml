name: HealthForiPad
options:
  bundleIdPrefix: app.healthdash
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  HealthForiPad:
    type: application
    platform: iOS
    sources: [HealthForiPad]
    entitlements:
      path: HealthForiPad/HealthForiPad.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.healthdash.HealthForiPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info-extra.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Health Dashboard"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Shows your blood pressure readings from Apple Health next to your Garmin data. Read-only; nothing is uploaded."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HealthForiPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HealthForiPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.healthdash.HealthForiPadTests
schemes:
  HealthForiPad:
    build:
      targets:
        HealthForiPad: all
        HealthForiPadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HealthForiPadTests]
